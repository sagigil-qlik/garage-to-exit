<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1222">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Garage to Exit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Garage to Exit — Idle Startup Prototype</title>
<style>
  :root{
    --bg:#0f1222; --card:#181c33; --card2:#1f2442; --line:#2a3058;
    --text:#eef0ff; --muted:#9aa0c3; --accent:#7c5cff; --accent2:#20d3b0;
    --gold:#ffc94d; --danger:#ff5c7a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  body{min-height:100vh;display:flex;justify-content:center;overflow-x:hidden}
  #app{width:100%;max-width:480px;padding:calc(10px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
  button:disabled{cursor:default}
  .ib{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.1);font-size:12px;line-height:20px;text-align:center;color:var(--muted);vertical-align:middle;flex:none}

  /* Header */
  .top{background:linear-gradient(145deg,#2a1f66,#151a3a 60%);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
  .top .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .top .right{display:flex;gap:6px;align-items:center;margin-inline-start:auto}
  .stage{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);padding:5px 10px;border-radius:999px;font-weight:600;font-size:14px}
  .stage .info{opacity:.6;font-size:12px}
  .exit{background:var(--card2);border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap}
  .exit.ready{background:linear-gradient(90deg,var(--gold),#ff9d4d);color:#241a00;border-color:transparent}
  .exit.hot{animation:pulse 1.4s infinite}
  .help{width:32px;height:32px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:15px}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,201,77,.6)}50%{box-shadow:0 0 0 8px rgba(255,201,77,0)}}
  .lbl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-top:10px}
  .cash{font-size:36px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.15}
  .income{color:var(--accent2);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
  .income .x2{background:var(--accent2);color:#002b23;border-radius:6px;padding:0 6px;margin-inline-start:6px;font-size:12px}
  .val{color:var(--muted);font-size:13px;margin-top:6px}
  .val b{color:var(--text)}
  .bar{height:6px;background:rgba(255,255,255,.1);border-radius:6px;margin-top:6px;overflow:hidden}
  .bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
  [dir="rtl"] .bar>div{background:linear-gradient(270deg,var(--accent),var(--accent2))}

  /* Actions */
  .actions{display:grid;grid-template-columns:1.1fr 1fr;gap:10px}
  .tap{background:linear-gradient(160deg,var(--accent),#5a3be0);border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:17px;box-shadow:0 6px 0 #3d26a8;transition:transform .05s}
  .tap:active{transform:translateY(4px);box-shadow:0 2px 0 #3d26a8}
  .tap .ic{font-size:30px}
  .tap small{font-weight:600;opacity:.85;font-size:13px}
  .boost{background:var(--card);border:1px dashed var(--accent2);border-radius:18px;padding:10px;text-align:center;font-weight:700;font-size:14px;display:flex;flex-direction:column;justify-content:center;gap:4px}
  .boost small{font-weight:500;color:var(--muted);font-size:12px;line-height:1.35}
  .boost.active{border-style:solid;background:rgba(32,211,176,.08)}
  .boost:disabled{opacity:.6}
  .hint{color:var(--gold);font-size:13px;text-align:center}
  .hint:empty{display:none}

  /* Team section */
  .sect{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;margin-top:2px}
  .modes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .modes span{color:var(--muted);font-size:12px;margin-inline-end:auto}
  .modes button{background:var(--card);border:1px solid var(--line);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted)}
  .modes button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* Cards */
  #gens{display:flex;flex-direction:column;gap:8px}
  .gen{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
  .gen .ico{font-size:28px;text-align:center}
  .gen .name{font-weight:700;font-size:15px}
  .gen .own{color:var(--accent2);font-weight:700;font-size:13px}
  .gen .desc{color:var(--muted);font-size:12px}
  .gen .stat{font-size:12px;margin-top:3px;color:#c8ccec}
  .gen .bl{font-size:11px;color:var(--gold);margin-top:3px}
  .mbar{height:4px;background:rgba(255,255,255,.08);border-radius:4px;margin-top:5px;overflow:hidden}
  .mbar>div{height:100%;background:var(--gold);width:0}
  .buy{background:var(--accent2);color:#00261f;border-radius:12px;padding:8px 10px;min-width:86px;display:flex;flex-direction:column;align-items:center;font-weight:800}
  .buy .bn{font-size:12px;opacity:.85}
  .buy .bc{font-size:14px;font-variant-numeric:tabular-nums}
  /* Not affordable yet: still tappable (explains what is missing) and fills up as cash grows */
  .buy.cant{color:var(--muted);background:linear-gradient(90deg,rgba(32,211,176,.28) var(--p,0%),var(--card2) var(--p,0%))}
  [dir="rtl"] .buy.cant{background:linear-gradient(270deg,rgba(32,211,176,.28) var(--p,0%),var(--card2) var(--p,0%))}
  .buy.shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .gen.locked{opacity:.55;grid-template-columns:44px 1fr}
  .gen.locked .ico{filter:grayscale(1) brightness(.4)}

  footer{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:12px;padding:4px 2px;flex-wrap:wrap}
  footer b{color:var(--gold)}
  footer .xp{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  footer .tools{display:flex;gap:6px;align-items:center}
  .small{background:transparent;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--muted)}
  .small[hidden]{display:none}
  a.small{text-decoration:none}
  footer .tools{flex-wrap:wrap;justify-content:flex-end}
  #adLoading{z-index:65}
  .spin{width:34px;height:34px;margin:4px auto 0;border:4px solid var(--line);border-top-color:var(--accent2);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #installBtn{border-color:var(--accent2);color:var(--accent2)}

  /* Floating text & toasts */
  .float{position:fixed;pointer-events:none;font-weight:800;color:var(--gold);font-size:18px;animation:floatUp .9s ease-out forwards;z-index:50;text-shadow:0 2px 6px rgba(0,0,0,.5)}
  @keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
  #toasts{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;width:min(92vw,440px);pointer-events:none}
  .toast{background:#262c55;border:1px solid var(--accent);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .25s ease-out;line-height:1.45}
  .toast.tip{background:#3a3115;border-color:var(--gold);color:#fff3cf}
  @keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

  /* Modals */
  .modal{position:fixed;inset:0;background:rgba(5,7,18,.78);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
  .modal.show{display:flex}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:420px;max-height:88vh;overflow:auto}
  .sheet h2{font-size:20px;margin-bottom:8px}
  .sheet p{color:#c8ccec;font-size:14px;line-height:1.55;margin-bottom:10px}
  .sheet .big{font-size:30px;font-weight:800;color:var(--gold);margin:6px 0 12px}
  .btns{display:flex;gap:8px;margin-top:12px}
  .btns button{flex:1;padding:12px;border-radius:12px;font-weight:800}
  .b-pri{background:var(--accent);color:#fff}
  .b-sec{background:var(--card2);border:1px solid var(--line)}
  .b-gold{background:linear-gradient(90deg,var(--gold),#ff9d4d);color:#241a00}
  .b-pri:disabled,.b-gold:disabled{opacity:.4}
  .kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;margin:8px 0}
  .kv div:nth-child(odd){color:var(--muted)}
  .kv div:nth-child(even){text-align:end;font-variant-numeric:tabular-nums}
  .log{font-family:ui-monospace,Consolas,monospace;font-size:11px;background:#0b0e1c;border-radius:10px;padding:8px;max-height:180px;overflow:auto;color:#a9b0dd;white-space:pre-wrap;user-select:text;direction:ltr;text-align:left}
  .devbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
  .devbtns button{background:var(--card2);border:1px solid var(--line);padding:9px;border-radius:10px;font-size:12px;font-weight:700}

  /* Intro, terms, stages */
  .hero{font-size:38px;text-align:center;margin-bottom:6px;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
  .intro h2{text-align:center;font-size:24px}
  .intro p{text-align:center}
  .langpick{display:flex;gap:6px;justify-content:center;align-items:center;margin:10px 0 4px}
  .langpick span{color:var(--muted);font-size:13px;margin-inline-end:4px}
  .langpick button{background:var(--card2);border:1px solid var(--line);padding:7px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
  .langpick button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .helplist,.stages{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
  .hitem{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}
  .hitem .hi{font-size:22px;text-align:center}
  .hitem .ht{display:block;font-size:14px;margin-bottom:2px}
  .hitem .hd{color:#c8ccec;font-size:13px;line-height:1.5}
  .srow{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .srow .si{font-size:20px;text-align:center}
  .srow b{display:block;font-size:14px}
  .srow .sd{color:#c8ccec;font-size:12px;line-height:1.45}
  .srow .sv{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .srow.cur{border-color:var(--gold);background:#2a2614}
  .srow.done{opacity:.6}

  /* Leaderboard */
  .lbsub{color:var(--muted);font-size:12px;margin:2px 0 8px}
  .linkbtn{background:none;color:var(--accent2);font-size:12px;font-weight:700;padding:0;text-decoration:underline}
  .lbwin:empty{display:none}
  .lbwin{background:#2a2614;border:1px solid var(--gold);border-radius:12px;padding:8px 10px;font-weight:700;font-size:13px;margin-bottom:8px;color:#fff3cf}
  .lbme{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
  .lbme div{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column}
  .lbme span{color:var(--muted);font-size:11px}
  .lbme b{font-size:15px;font-variant-numeric:tabular-nums}
  .lblist{display:flex;flex-direction:column;gap:6px}
  .lbrow{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
  .lbrow.me{border-color:var(--accent2);background:rgba(32,211,176,.08)}
  .lbr{font-weight:800;text-align:center;font-size:15px}
  .lbn b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lbn small{color:var(--muted);font-size:11px}
  .lbp{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
  .lbsep{text-align:center;color:var(--muted)}
  .lbstatus{color:var(--muted);font-size:13px;margin:4px 0}
  .lbstatus:empty{display:none}
  .nick{user-select:text;-webkit-user-select:text;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0b0e1c;color:var(--text);font:inherit;font-size:16px}
  .err{color:var(--danger);font-size:12px;min-height:16px;margin-top:4px}
  #nickModal{z-index:46}   /* opens on top of the leaderboard window */

  /* Fake ad */
  #ad{position:fixed;inset:0;background:#000;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
  #ad.show{display:flex}
  #ad .tag{font-size:11px;letter-spacing:2px;color:#888;border:1px solid #444;padding:3px 8px;border-radius:6px}
  #ad h3{font-size:22px}
  #ad p{color:#aaa;font-size:14px;max-width:320px}
  #ad .count{font-size:48px;font-weight:800;color:var(--accent2)}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="row">
      <button class="stage" id="stageBtn" data-i18n-aria="stagesAria"><span id="stageIcon"></span><span id="stageName"></span><span class="info">ⓘ</span></button>
      <div class="right">
        <button id="lbBtn" class="help" data-i18n-aria="lbAria">🏆</button>
        <button id="helpBtn" class="help" data-i18n-aria="helpAria">?</button>
        <button id="exitBtn" class="exit" data-i18n-aria="exitAria"></button>
      </div>
    </div>
    <div class="lbl"><span data-i18n="cashLbl"></span><button class="ib" data-info="numbers" data-i18n-aria="infoAria">i</button></div>
    <div class="cash" id="cash">$0</div>
    <div class="income" id="income"></div>
    <div class="val"><span data-i18n="valueLbl"></span> <b id="valuation">$0</b></div>
    <div class="val" id="nextStage"></div>
    <div class="bar"><div id="stageBar"></div></div>
  </header>

  <section class="actions">
    <button id="tapBtn" class="tap" data-i18n-aria="shipAria"><span class="ic">💻</span><span data-i18n="ship"></span><small id="tapValue"></small></button>
    <button id="boostBtn" class="boost"><span data-i18n="boostTitle"></span><small id="boostText"></small></button>
  </section>
  <div id="hint" class="hint"></div>

  <div class="sect"><span data-i18n="teamTitle"></span><button class="ib" data-info="team" data-i18n-aria="infoAria">i</button></div>
  <div class="modes" id="modes">
    <span data-i18n="modesLbl"></span>
    <button data-m="1">1</button><button data-m="10">10</button><button data-m="100">100</button><button data-m="max" data-i18n="modeMax"></button>
  </div>

  <main id="gens"></main>

  <footer>
    <div class="xp"><span data-i18n="xpLbl"></span> <b id="rep">0</b> <span id="repBonus"></span><button class="ib" data-info="xp" data-i18n-aria="infoAria">i</button></div>
    <div class="tools">
      <button class="small" id="installBtn" data-i18n="installBtn" hidden></button>
      <button class="small" id="shareBtn" data-i18n="shareBtn" hidden></button>
      <button class="small" id="privacyBtn" data-i18n="privacyBtn" hidden></button>
      <button class="small" id="langBtn"></button>
      <a class="small" id="policyLink" target="_blank" rel="noopener" data-i18n="policyLink"></a>
      <span id="verLbl" data-i18n="version"></span>
      <button class="small" id="devBtn" hidden>DEV</button>
    </div>
  </footer>
</div>

<div id="toasts"></div>

<!-- Offline earnings -->
<div class="modal" id="offlineModal"><div class="sheet">
  <h2 data-i18n="offTitle"></h2>
  <p id="offlineText"></p>
  <div class="big" id="offlineAmount"></div>
  <div class="btns">
    <button class="b-sec" id="offlineCollect" data-i18n="offCollect"></button>
    <button class="b-gold" id="offlineDouble" data-i18n="offDouble"></button>
  </div>
</div></div>

<!-- Sell company (prestige) -->
<div class="modal" id="exitModal"><div class="sheet">
  <h2 data-i18n="exitTitle"></h2>
  <p id="exitText"></p>
  <div class="kv" id="exitKv"></div>
  <p style="color:var(--muted);font-size:12px" data-i18n="exitNote"></p>
  <div class="btns">
    <button class="b-sec" id="exitCancel" data-i18n="exitCancel"></button>
    <button class="b-gold" id="exitConfirm" data-i18n="exitConfirm"></button>
  </div>
</div></div>

<!-- Dev panel -->
<div class="modal" id="devModal"><div class="sheet">
  <h2 data-i18n="devTitle"></h2>
  <div class="kv" id="devKv"></div>
  <div class="devbtns">
    <button id="dSkip10" data-i18n="dSkip10"></button>
    <button id="dSkip60" data-i18n="dSkip60"></button>
    <button id="dSpeed"></button>
    <button id="dOffline" data-i18n="dOffline"></button>
    <button id="dReplay" data-i18n="dReplay"></button>
    <button id="dReset"></button>
    <button id="dClose" data-i18n="dClose"></button>
  </div>
  <div style="font-size:12px;color:var(--muted);margin:6px 0 4px" data-i18n="dEvents"></div>
  <div class="log" id="devLog"></div>
</div></div>

<!-- Company stages -->
<div class="modal" id="stagesModal"><div class="sheet">
  <h2 data-i18n="stagesTitle"></h2>
  <p data-i18n="stagesIntro"></p>
  <div class="stages" id="stagesList"></div>
  <div class="btns"><button class="b-pri" id="stagesClose" data-i18n="helpClose"></button></div>
</div></div>

<!-- Nickname for the leaderboard -->
<div class="modal" id="nickModal"><div class="sheet">
  <h2 data-i18n="nickTitle"></h2>
  <p data-i18n="nickText"></p>
  <input id="nickInput" class="nick" maxlength="16" autocomplete="off" spellcheck="false">
  <div id="nickErr" class="err"></div>
  <div class="btns">
    <button class="b-sec" id="nickCancel" data-i18n="nickLater"></button>
    <button class="b-pri" id="nickSave" data-i18n="nickSave"></button>
  </div>
</div></div>

<!-- Weekly leaderboard -->
<div class="modal" id="lbModal"><div class="sheet">
  <h2 data-i18n="lbTitle"></h2>
  <div class="lbsub"><span id="lbEnds"></span> · <button class="linkbtn" id="lbHow" data-i18n="lbHow"></button></div>
  <div id="lbWinner" class="lbwin"></div>
  <div id="lbMine"></div>
  <div class="lbsub"><span id="lbNick"></span> · <button class="linkbtn" id="lbNickBtn" data-i18n="lbNickChange"></button></div>
  <div id="lbStatus" class="lbstatus"></div>
  <div id="lbList" class="lblist"></div>
  <div class="btns"><button class="b-pri" id="lbClose" data-i18n="helpClose"></button></div>
</div></div>

<!-- Terms & explanations (full list or a section) -->
<div class="modal" id="helpModal"><div class="sheet">
  <h2 id="helpTitle"></h2>
  <div class="helplist" id="helpList"></div>
  <div class="btns"><button class="b-pri" id="helpClose" data-i18n="helpClose"></button></div>
</div></div>

<!-- First-launch welcome (kept last so it sits on top of other modals) -->
<div class="modal" id="introModal"><div class="sheet intro">
  <div class="hero">🔧 → 🦄 → 💰</div>
  <h2 data-i18n="gameName"></h2>
  <p data-i18n="introText"></p>
  <div class="langpick" id="langPick">
    <span data-i18n="introLang"></span>
    <button data-lang="en">English</button><button data-lang="he">עברית</button>
  </div>
  <div class="btns">
    <button class="b-sec" id="introHelp" data-i18n="introHelp"></button>
    <button class="b-pri" id="introStart" data-i18n="introStart"></button>
  </div>
</div></div>

<!-- Real ad is loading (Android app) -->
<div class="modal" id="adLoading"><div class="sheet" style="text-align:center;max-width:260px">
  <div class="spin"></div>
  <p data-i18n="adLoading" style="margin:10px 0 0"></p>
</div></div>

// Experience points for a given lifetime total (epsilon guards exact cubes against rounding).
function xpFor(total) { return Math.floor(Math.cbrt(Math.max(0, total) / XP_DIVISOR) + 1e-9); }
function fresh() {
  const now = Date.now();
  return { v:1, cash:START_CASH, runEarned:0, totalEarned:0, owned:GENS.map(() => 0), rep:0, exits:0,
    boostUntil:0, lastSeen:now, taps:0, createdAt:now, runStartedAt:now, buyMode:1,
    adsWatched:0, stageIdx:0, playSec:0, lang:detectLang(), seenIntro:false, tips:{},
    nick:'', runTainted:false, season:null, prevSeason:null, econ:ECON_VERSION };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    const merged = Object.assign(fresh(), s);
    merged.owned = GENS.map((_, i) => (Array.isArray(s.owned) && Number(s.owned[i])) || 0);
    ['cash','runEarned','totalEarned','rep'].forEach(k => { if (!isFinite(merged[k])) merged[k] = 0; });
    if (!LANGS.includes(merged.lang)) merged.lang = detectLang();
    if (!merged.tips || typeof merged.tips !== 'object') merged.tips = {};
    if (![1, 10, 100, 'max'].includes(merged.buyMode)) merged.buyMode = 1;
    if (typeof merged.nick !== 'string') merged.nick = '';
    if (merged.season && typeof merged.season !== 'object') merged.season = null;
    if (s.econ !== ECON_VERSION) {          // saved under an older experience rule: cap points to what the new rule gives
      merged.rep = Math.min(merged.rep, xpFor(merged.totalEarned)); merged.econ = ECON_VERSION;
    }
    return merged;
  } catch (_) { return null; }
}
function save() {

  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {}
}

/* ================= Economy ================= */
const milestoneCount = n => MILESTONES.reduce((c, m) => c + (n >= m ? 1 : 0), 0);
const nextMilestone = n => MILESTONES.find(m => m > n);

const repMult = () => 1 + REP_BONUS * S.rep;
const boostActive = () => Date.now() < S.boostUntil;
const genIncome = i => GENS[i].inc * S.owned[i] * Math.pow(2, milestoneCount(S.owned[i])) * repMult();
const baseIncome = () => GENS.reduce((sum, _, i) => sum + genIncome(i), 0);
const income = () => baseIncome() * (boostActive() ? 2 : 1);

// Experience comes from everything ever earned; a sale gives only what was added since the last sale.
const xpTotal = () => xpFor(S.totalEarned);

const nextXpAt = () => Math.pow(S.rep + 1, 3) * XP_DIVISOR;          // lifetime earnings needed for the next point
// Competition points for selling a company worth v, built in m minutes.
function salePoints(v, m) {
  const base = 10 * Math.log10(Math.max(v, 1) / 1e5);
  const bonus = 1 + SPEED_BONUS_MAX * Math.max(0, 1 - m / SPEED_BONUS_MIN);
  return Math.max(0, Math.round(base * bonus));
}
// Seasons run Sunday 00:00 to Saturday 24:00, Israel time. Season id = that Sunday's date (YYYY-MM-DD).
function israelParts(ms) {
  const f = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Jerusalem', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short', hourCycle: 'h23' });
  const p = {}; f.formatToParts(new Date(ms)).forEach(x => { p[x.type] = x.value; });
  return { y: +p.year, mo: +p.month, d: +p.day, h: +p.hour, mi: +p.minute, s: +p.second,
    wd: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday) };
}
function seasonInfo(ms = Date.now()) {
  const p = israelParts(ms);
  const offset = Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s) - Math.floor(ms / 1000) * 1000;   // Israel minus UTC
  const startLocal = Date.UTC(p.y, p.mo - 1, p.d - p.wd);

  const prevId = new Date(startLocal - 7 * 864e5).toISOString().slice(0, 10);

}
const tapValue = () => 1 + 0.05 * income();
const stageIndex = v => { let k = 0; STAGES.forEach((s, i) => { if (v >= s.v) k = i; }); return k; };

function unitCost(i) { return GENS[i].cost * Math.pow(R, S.owned[i]); }
function costN(i, n) { return unitCost(i) * (Math.pow(R, n) - 1) / (R - 1); }
function maxAffordable(i) {
  let n = Math.floor(Math.log(S.cash * (R - 1) / unitCost(i) + 1) / Math.log(R));
  if (!isFinite(n) || n < 0) n = 0;
  while (n > 0 && costN(i, n) > S.cash) n--;

}
// 10 / 100 mean "up to N": buy as many as you can afford, never fewer than 1 shown.
function buyCount(i) {
  const aff = maxAffordable(i);
  return S.buyMode === 'max' ? Math.max(1, aff) : Math.min(S.buyMode, Math.max(1, aff));
}

function earn(x) { S.cash += x; S.runEarned += x; S.totalEarned += x; }

/* ================= Formatting ================= */
const UNITS = ['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n, dec = false) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n, dec);
  if (n < 1000) return (dec && n < 100 && n % 1 !== 0) ? n.toFixed(1).replace(/\.0$/, '') : Math.floor(n).toString();
  let e = Math.floor(Math.log10(n) / 3);
  let v = n / Math.pow(10, 3 * e);
  if (v >= 999.995) { e++; v = n / Math.pow(10, 3 * e); }
  if (e > UNITS.length) return n.toExponential(2).replace('+', '');
  return v.toFixed(v < 100 ? 2 : 1).replace(/\.?0+$/, '') + UNITS[e - 1];
}

  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;

}

  const sec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return iso(`${h}:${pad(m)}:${pad(s)}`);
}

let lastNeedToast = 0;
function buy(i, btn) {
  const n = buyCount(i), c = costN(i, n);
  if (c > S.cash) {
    // Never a dead button: explain what is missing.
    if (btn) { btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake'); }
    if (Date.now() - lastNeedToast > 1500) {
      lastNeedToast = Date.now();
      toast(t('toastNeed', { v: money(c - S.cash, true) }));
      track('buy_blocked', { gen: GENS[i].id, missing: Math.round(c - S.cash) });
    }

  }
  const before = S.owned[i];
  S.cash -= c; S.owned[i] += n;
  if (before === 0) track('first_purchase', { gen: GENS[i].id, run_sec: Math.round((Date.now() - S.runStartedAt) / 1000) });
  track('buy', { gen: GENS[i].id, n, owned: S.owned[i] });
  const gained = milestoneCount(S.owned[i]) - milestoneCount(before);
  if (gained > 0) {
    toast(t('toastMilestone', { icon: GENS[i].icon, name: genName(i), m: prevMilestone(S.owned[i]), k: Math.pow(2, gained) }));
    track('milestone', { gen: GENS[i].id, owned: S.owned[i] });
  }

  render(true);
}

function checkStage() {
  const k = stageIndex(valuation());

    for (let j = S.stageIdx + 1; j <= k; j++) {

    }
    toast(t('toastStage', { icon: STAGES[k].icon, name: stageName(k) }));
    S.stageIdx = k;
    if (k >= 1) tip('preSeed', 'tipPreSeed');

  eb.classList.toggle('hot', g >= Math.max(5, Math.ceil(S.rep / 2)));   // a good deal: +50% experience (at least 5 points)

  $('hint').textContent = !anyOwned && S.exits === 0 ? t(S.cash >= GENS[0].cost ? 'hintHire' : 'hintTap') : '';

  // Modes
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', String(S.buyMode) === b.dataset.m));

  // Cards
  cardEls.forEach((c, i) => {
    const n = buyCount(i), cost = costN(i, n), nm = nextMilestone(S.owned[i]), pm = prevMilestone(S.owned[i]);
    c.own.textContent = S.owned[i] ? '· ' + t('owned', { n: S.owned[i] }) : '';
    c.stat.textContent = S.owned[i]
      ? t('cardRate', { v: money(genIncome(i) * b2, true) })
      : t('cardRateEach', { v: money(GENS[i].inc * repMult() * b2, true) });
    c.mbar.style.width = nm ? ((S.owned[i] - pm) / (nm - pm) * 100) + '%' : '100%';
    c.bl.textContent = nm ? t('cardBonus', { n: nm - S.owned[i] }) : t('cardAll');
    c.bn.textContent = t('hireN', { n });
    c.bc.textContent = money(cost);
    const cant = cost > S.cash;
    c.btn.classList.toggle('cant', cant);   // still an active button: tapping it explains what is missing
    c.btn.style.setProperty('--p', cant ? Math.max(0, Math.min(100, S.cash / cost * 100)).toFixed(1) + '%' : '0%');
  });

  $('rep').textContent = fmt(S.rep);

}

/* ================= Weekly competition ================= */
function currentSeason() {
  const si = seasonInfo();
  if (!S.season || S.season.id !== si.id) {
    if (S.season && S.season.sales > 0) S.prevSeason = { ...S.season };
    S.season = { id: si.id, score: 0, sales: 0, best: 0, fastestMin: 0, pending: false };
  }
  return S.season;
}
function recordSale(val, mins, pts) {
  const s = currentSeason();
  s.score += pts; s.sales += 1;
  s.best = Math.max(s.best, val);
  s.fastestMin = s.fastestMin ? Math.min(s.fastestMin, mins) : mins;
  s.pending = true;
}
const lbNum = n => iso(Math.round(n).toLocaleString('en-US'));
function dh(ms) {
  const h = Math.max(0, Math.floor(ms / 3600e3)), d = Math.floor(h / 24);
  return d ? t('tDH', { d, h: h % 24 }) : t('tHM', { h, m: Math.max(0, Math.floor(ms / 60e3) % 60) });
}

// Global leaderboard client. Talks to Firebase through leaderboard.js (window.G2ELB), loaded only when configured.
const LB = {
  api: null, loading: null, error: null,
  connected() { return !!(window.G2ELB_MOCK || FIREBASE_CONFIG); },
  ensure() {
    if (this.api) return Promise.resolve(this.api);
    if (window.G2ELB_MOCK) { this.api = window.G2ELB_MOCK; return Promise.resolve(this.api); }
    if (!FIREBASE_CONFIG) return Promise.resolve(null);
    if (!this.loading) {
      this.loading = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'leaderboard.js'; s.onload = resolve; s.onerror = () => reject(new Error('load'));
        document.head.appendChild(s);
      }).then(() => window.G2ELB.init(FIREBASE_CONFIG)).then(() => (this.api = window.G2ELB))
        .catch(e => { this.loading = null; this.error = String(e && e.message || e); throw e; });
    }
    return this.loading;
  },
  async sync() {
    const s = currentSeason();
    if (!s.pending || !S.nick || !this.connected()) return false;
    try {
      const api = await this.ensure(); if (!api) return false;
      await api.submit(s.id, { name: S.nick, score: s.score, sales: s.sales, best: s.best,
        fastestMin: Math.round(s.fastestMin * 10) / 10, lang: S.lang });
      s.pending = false; save(); track('score_submitted', { score: s.score, sales: s.sales });
      return true;
    } catch (e) { this.error = String(e && e.message || e); track('score_submit_failed', { error: this.error }); return false; }
  },
};

let pendingOffline = 0;
function processOffline() {
  const now = Date.now();
  const elapsed = (now - S.lastSeen) / 1000;
  S.lastSeen = now;
  if (elapsed < 30) return;
  const sec = Math.min(elapsed, OFFLINE_CAP_SEC);
  const boostedSec = Math.max(0, Math.min(sec, (S.boostUntil - (now - elapsed * 1000)) / 1000));
  const amount = baseIncome() * (sec + boostedSec);
  if (amount <= 0) return;
  pendingOffline = amount;
  $('offlineText').textContent = t('offText', { t: hms(elapsed), cap: elapsed > OFFLINE_CAP_SEC ? t('offCap') : '' });
  $('offlineAmount').textContent = money(amount);
  $('offlineModal').classList.add('show');
  track('offline_offer', { away_sec: Math.round(elapsed), amount: Math.round(amount) });
}
function collectOffline(mult) {
  if (pendingOffline > 0) {
    earn(pendingOffline * mult);
    toast(t('toastCollected', { v: money(pendingOffline * mult) }));
    track('offline_collected', { mult });
  }
  pendingOffline = 0;
  $('offlineModal').classList.remove('show');
  save(); render();
}
$('offlineCollect').addEventListener('click', () => collectOffline(1));

});

/* ================= Loop & lifecycle ================= */
let last = performance.now();
let paused = false, loopId = null;
function startLoop() { if (!loopId) loopId = setInterval(tick, 100); }
function stopLoop() { clearInterval(loopId); loopId = null; }
function tick() {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 1);
  last = now;
  if (document.hidden || paused) return;
  S.playSec += dt;
  earn(income() * dt * speed);
  checkStage();
  render();
}

  try { await navigator.share({ title: t('gameName'), text: t('shareText'), url: location.href.split('#')[0] }); track('share_done'); } catch (_) {}
});
$('policyLink').href = PRIVACY_URL;
$('privacyBtn').addEventListener('click', async () => {
  track('privacy_options_opened');
  if (window.G2ENative) await window.G2ENative.showPrivacyOptions();
});
// Hidden way to reach the developer panel on a phone: tap the version label 7 times.
let verTaps = 0, verTimer = null;
$('verLbl').addEventListener('click', () => {
  verTaps++; clearTimeout(verTimer); verTimer = setTimeout(() => { verTaps = 0; }, 2000);
  if (verTaps >= 7) { verTaps = 0; $('devBtn').hidden = !$('devBtn').hidden; }
});

/* ================= Android app hooks (called from native.js) ================= */
const MODAL_ORDER = ['nickModal', 'lbModal', 'offlineModal', 'exitModal', 'devModal', 'stagesModal', 'helpModal', 'introModal'];
window.__g2eHooks = {
  // Android back button: close the top window. Returns true when something was closed.
  onBack() {
    if ($('adLoading').classList.contains('show') || $('ad').classList.contains('show')) return true;
    for (const id of MODAL_ORDER) {
      if (!$(id).classList.contains('show')) continue;
      if (id === 'offlineModal') collectOffline(1);
      else if (id === 'devModal') closeDev();
      else if (id === 'introModal') { $(id).classList.remove('show'); finishIntro(); }
      else if (id === 'helpModal') { $(id).classList.remove('show'); finishIntro(); }
      else $(id).classList.remove('show');
      return true;
    }
    return false;
  },
  pause() { if (paused) return; paused = true; stopLoop(); save(); track('session_pause', { native: true }); },
  resume() { if (!paused) return; paused = false; processOffline(); last = performance.now(); startLoop(); render(); LB.sync(); },
};
if (NATIVE) {
  const s = document.createElement('script');
  s.src = 'native.js';
  s.onload = () => { if (window.G2ENative) window.G2ENative.onChange(st => { $('privacyBtn').hidden = !st.privacyOptionsRequired; }); };
  document.head.appendChild(s);
}
if (isWeb && 'serviceWorker' in navigator) {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (_) {}
}

track('session_start', { returning: !!saved, exits: S.exits, lang: S.lang, standalone: isStandalone() });
applyLang();
if (!S.seenIntro) { $('introModal').classList.add('show'); track('tutorial_shown', { lang: S.lang }); }
if (saved) processOffline();
startLoop();
currentSeason();
setTimeout(() => LB.sync(), 3000);
setInterval(() => { if (!document.hidden && !paused) save(); }, 5000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { save(); track('session_pause'); }
  else { processOffline(); last = performance.now(); render(); }
});
window.addEventListener('pagehide', () => { if (!document.hidden) save(); });

// Tiny debug handle for automated tests.
window.__g2e = { get S() { return S; }, income, valuation, exitGain, costN, maxAffordable, buy, earn, EVENTS,
  processOffline, setLang, STR, GEN_TXT, STAGE_TXT, STAGE_DESC, TERMS, TERM_GROUPS, openHelp,
  salePoints, seasonInfo, xpTotal, nextXpAt, render, currentSeason, LB, renderLB };
})();
</script>
