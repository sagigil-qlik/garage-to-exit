<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6C4DFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="האקזיט המטורף">
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="משחק סטארטאפ: גייס צוות, בנה חברת מיליארד, מכור אותה והתחרה בטבלה השבועית. Build a startup from a garage to a billion-dollar exit.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="האקזיט המטורף">
<meta property="og:title" content="האקזיט המטורף: מהמוסך לחברת מיליארד">
<meta property="og:description" content="גייס צוות, בנה חברת מיליארד ומכור אותה. כמה מהר תגיע לאקזיט? משחק חינמי בעברית ובאנגלית.">
<meta property="og:url" content="https://sagigil-qlik.github.io/garage-to-exit/">
<meta property="og:image" content="https://sagigil-qlik.github.io/garage-to-exit/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<title>האקזיט המטורף — משחק סטארטאפ</title>
<style>
  :root{
    --bg:#FFF6EA; --bg2:#EEF4FF; --card:#FFFFFF; --card2:#F5F1FF; --line:#ECE5FB;
    --text:#1E2340; --muted:#5F6587; --soft:#8A8FB0;
    --accent:#6C4DFF; --accent-d:#4B2FD6; --accent-l:#EEE9FF; --accent-t:#5636E8;
    --green:#1FB868; --green-d:#11894B; --green-l:#E3F8EC;
    --gold:#FFB800; --gold-d:#D98F00; --orange:#FF7A1A; --orange-d:#D95800;
    --pink:#F23A86; --sky:#2F8BFF; --danger:#E5484D;
    --shadow:0 2px 0 #E6DEFA,0 8px 22px rgba(80,60,170,.08);
    --r:18px;
    /* kept for older rules and inline styles */
    --accent2:var(--green);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  html,body{color:var(--text);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  body{min-height:100vh;display:flex;justify-content:center;overflow-x:hidden;
    background:radial-gradient(1200px 500px at 50% -120px,#FFE2C2 0%,rgba(255,226,194,0) 60%),linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed}
  #app{width:100%;max-width:480px;padding:calc(10px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
  button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
  button:disabled{cursor:default}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #FFB800;outline-offset:2px}
  svg.ic{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.15em}
  .ib{position:relative;width:22px;height:22px;border-radius:50%;background:var(--accent-l);font-size:12px;font-weight:800;line-height:22px;text-align:center;color:var(--accent-t);vertical-align:middle;flex:none}

  /* Header */
  .top{position:relative;overflow:hidden;background:linear-gradient(150deg,#7354FA 0%,#5B3FF0 48%,#2F6BEB 100%);border-radius:24px;padding:10px 14px 12px;color:#fff;
    box-shadow:0 5px 0 #4B2FD6,0 14px 30px rgba(76,52,214,.28)}
  .top::before,.top::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
  .top::before{width:220px;height:220px;inset-inline-end:-70px;top:-90px}
  .top::after{width:140px;height:140px;inset-inline-start:-50px;bottom:-70px}
  .top>*{position:relative}
  .top .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .top .right{display:flex;gap:7px;align-items:center;margin-inline-start:auto}
  .stage{display:flex;align-items:center;gap:7px;background:#fff;color:var(--text);padding:4px 12px 4px 5px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 3px 0 rgba(30,20,110,.25)}
  [dir="rtl"] .stage{padding:4px 5px 4px 12px}
  .stage svg.ic{font-size:26px}
  .stage .info{color:var(--soft);font-size:13px}
  .vrow{display:flex;align-items:center;gap:10px;margin-top:2px}
  .vtxt{flex:1;min-width:0}
  .exit{display:flex;flex:none;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);color:#fff;padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;white-space:nowrap}
  .exit svg.ic{font-size:16px}
  .exit.ready{background:linear-gradient(180deg,#FFD452,#FF9A1F);border-color:transparent;color:#4A2600;box-shadow:0 3px 0 #C96A00}
  .exit.hot{animation:pulse 1.4s infinite}
  .help{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;font-size:19px;box-shadow:0 3px 0 rgba(30,20,110,.25)}
  .help:active,.stage:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(30,20,110,.25)}
  @keyframes pulse{0%,100%{box-shadow:0 3px 0 #C96A00,0 0 0 0 rgba(255,212,82,.85)}50%{box-shadow:0 3px 0 #C96A00,0 0 0 9px rgba(255,212,82,0)}}
  .lbl{display:flex;align-items:center;gap:6px;color:#fff;font-size:12px;font-weight:500;margin-top:6px}
  .top .ib{background:rgba(255,255,255,.22);color:#fff}
  .ib::after{content:'';position:absolute;inset:-11px}   /* bigger finger target, same look */
  .stage,.exit{min-height:40px}
  .buy.nudge{animation:nudge 1.3s ease-in-out infinite}
  @keyframes nudge{0%,100%{outline:3px solid rgba(255,196,61,0);outline-offset:2px}50%{outline:3px solid rgba(255,196,61,.95);outline-offset:5px}}   /* a glow, the button itself stays still */
  #helpModal .btns{position:sticky;bottom:-20px;background:#fff;padding:10px 0 4px;margin-top:10px}
  #soldModal .sheet{position:relative;z-index:1}
  #tipbox{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:35;width:min(92vw,440px);pointer-events:none}
  .cash{font-size:34px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1;text-shadow:0 3px 0 rgba(40,20,140,.35)}
  .income{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px;color:#E6FFF4;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
  .income .x2{background:#FFD452;color:#4A2600;border-radius:999px;padding:0 8px;font-size:12px;font-weight:800}
  .val{color:#fff;font-size:12px;margin-top:3px}
  .incrow{display:flex;align-items:center;gap:6px}
  .val .ib{width:18px;height:18px;line-height:18px;font-size:11px}
  .lbl .runclock{margin:0;margin-inline-start:auto;font-size:12px}
  .runclock{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);border-radius:999px;padding:2px 10px 2px 8px;font-weight:700;font-variant-numeric:tabular-nums}
  .runclock svg.ic{font-size:14px}
  .runclock b{font-weight:900}
  .val b{color:#fff;font-weight:800}
  .bar{height:10px;background:rgba(255,255,255,.22);border-radius:999px;margin-top:8px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.08)}
  .bar>div{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#FFE36B,#FF9A1F);transition:width .3s}
  [dir="rtl"] .bar>div{background:linear-gradient(270deg,#FFE36B,#FF9A1F)}

  /* Actions */
  .actions{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
  .actions.solo{grid-template-columns:1fr}
  .boost[hidden]{display:none}
  .tap{position:relative;background:linear-gradient(180deg,#FF8A3D 0%,#E8561A 100%);color:#fff;border-radius:22px;padding:12px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-weight:900;font-size:19px;box-shadow:0 6px 0 #B23A08,0 12px 22px rgba(255,106,43,.28);transition:transform .05s,box-shadow .05s;text-shadow:0 2px 0 rgba(150,50,0,.3)}
  .tap:active{transform:translateY(5px);box-shadow:0 1px 0 #B23A08,0 4px 10px rgba(255,106,43,.25)}
  .tap .ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;margin-bottom:4px}
  .tap .ic svg.ic{font-size:30px;color:#fff;--ic2:#FF6A2B}
  .tap small{font-weight:700;font-size:13px;color:#fff;text-shadow:none;background:rgba(110,30,0,.32);border-radius:999px;padding:1px 10px;margin-top:2px}
  .boost{background:#fff;border:2.5px solid #9DE6BF;border-radius:22px;padding:10px;text-align:center;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text);box-shadow:var(--shadow)}
  .boost .bi{width:34px;height:34px;border-radius:11px;background:linear-gradient(180deg,#5BE89A,#17B865);display:grid;place-items:center;box-shadow:0 3px 0 #0F8F4D}
  .boost .bi svg.ic{font-size:20px;color:#fff;--ic2:#17B865}
  .boost small{font-weight:500;color:var(--muted);font-size:12px;line-height:1.35}
  .boost.active{border-style:solid;border-color:var(--green);background:var(--green-l)}
  .boost:disabled{opacity:.6}
  .hint{background:#FFF4D1;color:#7A5200;border-radius:14px;padding:8px 12px;font-size:13px;font-weight:600;text-align:center}
  .hint:empty{display:none}

  /* Team section */
  .sect{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;margin-top:4px}
  .sect svg.ic{font-size:22px;color:var(--accent)}
  .modes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .modes span{color:var(--muted);font-size:12px;font-weight:500;margin-inline-end:auto}
  .modes button{background:#fff;padding:9px 15px;min-height:40px;border-radius:999px;font-size:13px;font-weight:800;color:var(--muted);box-shadow:0 2px 0 #E1D9F6}
  .modes button.on{background:var(--accent);color:#fff;box-shadow:0 2px 0 var(--accent-d)}
  @media (max-width:380px){.modes span{flex-basis:100%;margin:0}.modes button{padding:6px 12px}}

  /* Cards */
  #gens{display:flex;flex-direction:column;gap:10px}
  .gen{background:var(--card);border-radius:var(--r);padding:10px 10px 10px 10px;display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;box-shadow:var(--shadow)}
  .gen .ico svg{width:54px;height:54px;display:block;filter:drop-shadow(0 3px 0 rgba(30,20,110,.12))}
  .gen .name{font-weight:800;font-size:16px;line-height:1.25}
  .gen .own{display:inline-block;background:var(--accent-l);color:var(--accent-t);font-weight:800;font-size:12px;border-radius:999px;padding:0 8px;margin-inline-start:4px;vertical-align:1px}
  .gen .desc{color:var(--muted);font-size:12px;margin-top:1px}
  .gen .stat{font-size:12px;margin-top:3px;color:var(--text);font-weight:600}
  .gen .bl{font-size:11px;color:#9A6400;font-weight:600;margin-top:3px}
  .mbar{height:6px;background:#F1ECFF;border-radius:999px;margin-top:5px;overflow:hidden}
  .mbar>div{height:100%;background:linear-gradient(90deg,#FFE36B,#FFB800);width:0;border-radius:999px}
  [dir="rtl"] .mbar>div{background:linear-gradient(270deg,#FFE36B,#FFB800)}
  .buy{background:linear-gradient(180deg,#14955A,#0B7340);color:#fff;border-radius:14px;padding:7px 10px;min-width:88px;display:flex;flex-direction:column;align-items:center;font-weight:900;box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 4px 0 #075A31;transition:transform .05s;text-shadow:0 1px 0 rgba(0,60,30,.3)}
  .buy:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 1px 0 #075A31}
  .buy .bn{font-size:12px;font-weight:700;opacity:.95}
  .buy .bc{font-size:15px;font-variant-numeric:tabular-nums}
  /* Not affordable yet: still tappable (explains what is missing) and fills up as cash grows */
  .buy.cant{color:var(--muted);text-shadow:none;box-shadow:0 4px 0 #DCD6EE;background:linear-gradient(90deg,#CFF3DE var(--p,0%),#F2F0F8 var(--p,0%))}
  [dir="rtl"] .buy.cant{background:linear-gradient(270deg,#CFF3DE var(--p,0%),#F2F0F8 var(--p,0%))}
  .buy.shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .gen.locked{grid-template-columns:54px 1fr;background:rgba(255,255,255,.55);box-shadow:none;border:2px dashed #DCD3F5}
  .gen.locked .ico svg{filter:grayscale(1) opacity(.45)}
  .gen.locked .name{color:var(--muted)}

  footer{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:12px;padding:4px 2px;flex-wrap:wrap}
  footer b{color:var(--accent-t);font-weight:900}
  footer .xp{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-weight:600}
  footer .xp svg.ic{font-size:16px;color:var(--accent)}
  footer .tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .small{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:7px 11px;min-height:34px;font-size:12px;font-weight:700;color:var(--muted);box-shadow:0 2px 0 #E6DEFA}
  .small[hidden]{display:none}
  a.small{text-decoration:none}
  #adLoading{z-index:65}
  .spin{width:36px;height:36px;margin:4px auto 0;border:4px solid var(--accent-l);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #installBtn{color:var(--green-d)}

  /* Floating text & toasts */
  .float{position:fixed;pointer-events:none;font-weight:900;color:#FFB800;font-size:20px;animation:floatUp .9s ease-out forwards;z-index:50;
    text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 4px 8px rgba(0,0,0,.15)}
  @keyframes floatUp{from{opacity:1;transform:translate(-50%,0) scale(1)}to{opacity:0;transform:translate(-50%,-80px) scale(1.15)}}
  #toasts{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;width:min(92vw,440px);pointer-events:none}
  .toast{display:flex;align-items:center;gap:10px;background:#fff;color:var(--text);border-radius:16px;padding:10px 14px;font-weight:700;font-size:14px;box-shadow:0 4px 0 #E2D9FA,0 12px 28px rgba(40,30,110,.18);animation:tin .25s ease-out;line-height:1.45}
  .toast svg.ic{font-size:28px}
  .toast.tip{background:#FFF4D1;color:#5C3D00;box-shadow:0 4px 0 #F3DE9E,0 12px 28px rgba(120,90,0,.15)}
  @keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}

  /* Modals */
  .modal{position:fixed;inset:0;background:rgba(30,35,64,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:40;padding:18px}
  .modal.show{display:flex}
  .sheet{background:#fff;border-radius:26px;padding:20px;width:100%;max-width:420px;max-height:88vh;overflow:auto;box-shadow:0 6px 0 #E2D9FA,0 24px 60px rgba(30,20,90,.3);animation:pop .22s ease-out}
  @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  .sheet h2{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:900;margin-bottom:8px}
  .sheet h2 svg.ic{font-size:28px}
  .sheet p{color:#4A5072;font-size:14px;line-height:1.6;margin-bottom:10px}
  .sheet .big{font-size:32px;font-weight:900;color:var(--green);margin:6px 0 12px;font-variant-numeric:tabular-nums}
  .btns{display:flex;gap:8px;margin-top:14px}
  .btns button{flex:1;padding:12px;border-radius:16px;font-weight:900;font-size:15px;transition:transform .05s}
  .btns button:active{transform:translateY(3px)}
  .b-pri{background:linear-gradient(180deg,#8366FF,#6C4DFF);color:#fff;box-shadow:0 4px 0 var(--accent-d)}
  .b-sec{background:var(--card2);color:var(--accent-d);box-shadow:0 4px 0 #DDD3FA}
  .b-gold{background:linear-gradient(180deg,#FFD452,#FF9A1F);color:#4A2600;box-shadow:0 4px 0 #C96A00}
  .b-pri:disabled,.b-gold:disabled{opacity:.45}
  .kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px;margin:8px 0;background:var(--card2);border-radius:14px;padding:10px 12px}
  .kv div:nth-child(odd){color:var(--muted)}
  .kv div:nth-child(even){text-align:end;font-variant-numeric:tabular-nums;font-weight:800}
  .log{font-family:ui-monospace,Consolas,monospace;font-size:11px;background:#1E2340;border-radius:12px;padding:8px;max-height:180px;overflow:auto;color:#C9CEF0;white-space:pre-wrap;user-select:text;direction:ltr;text-align:left}
  .devbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
  .devbtns button{background:var(--card2);color:var(--accent-d);padding:9px;border-radius:12px;font-size:12px;font-weight:800;box-shadow:0 2px 0 #DDD3FA}

  /* Intro, terms, stages */
  .hero{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0 10px}
  [dir="rtl"] .hero .arr{transform:scaleX(-1)}
  .hero .logo{width:96px;height:96px;border-radius:22px;filter:drop-shadow(0 6px 0 rgba(76,47,214,.25))}
  .hero .path{display:flex;align-items:center;gap:4px}
  .hero .path svg{width:30px;height:30px}
  .hero .arr{color:var(--soft);font-weight:900}
  .intro h2{justify-content:center;font-size:28px;margin-bottom:4px}
  .intro .tagline{text-align:center;color:var(--accent-t);font-weight:800;margin-bottom:8px}
  .intro p{text-align:center}
  .langpick{display:flex;gap:6px;justify-content:center;align-items:center;margin:10px 0 4px}
  .langpick span{color:var(--muted);font-size:13px;margin-inline-end:4px}
  .langpick button{background:var(--card2);padding:7px 16px;border-radius:999px;font-weight:800;font-size:14px;color:var(--muted);box-shadow:0 2px 0 #DDD3FA}
  .langpick button.on{background:var(--accent);color:#fff;box-shadow:0 2px 0 var(--accent-d)}
  .helplist,.stages{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
  .hitem{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;background:var(--card2);border-radius:16px;padding:10px}
  .hitem .hi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#fff;box-shadow:0 2px 0 #E2D9FA}
  .hitem .hi svg.ic{font-size:24px}
  .hitem .ht{display:block;font-size:15px;font-weight:800;margin-bottom:2px}
  .hitem .hd{color:#4A5072;font-size:13px;line-height:1.55}
  .srow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--card2);border-radius:16px;padding:8px 10px}
  .srow .si svg{width:40px;height:40px;display:block}
  .srow b{display:block;font-size:15px;font-weight:800}
  .srow .sd{color:#4A5072;font-size:12px;line-height:1.45}
  .srow .sv{color:var(--muted);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .srow.cur{background:#FFF4D1;box-shadow:inset 0 0 0 2.5px #FFC43D}
  .srow.done{opacity:.55}

  /* Leaderboard */
  .lbsub{color:var(--muted);font-size:12px;margin:2px 0 8px}
  .linkbtn{background:none;color:var(--accent-t);font-size:12px;font-weight:800;padding:0;text-decoration:underline}
  .lbwin:empty{display:none}
  .lbwin{display:flex;align-items:center;gap:8px;background:#FFF4D1;border-radius:14px;padding:9px 12px;font-weight:800;font-size:13px;margin-bottom:8px;color:#5C3D00}
  .lbwin svg.ic{font-size:24px}
  .lbme{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
  .lbme div{background:var(--card2);border-radius:12px;padding:7px 10px;display:flex;flex-direction:column}
  .lbme span{color:var(--muted);font-size:11px;font-weight:600}
  .lbme b{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
  .lblist{display:flex;flex-direction:column;gap:6px}
  .lbrow{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:7px 10px;box-shadow:0 2px 0 #ECE5FB,0 0 0 1.5px #F1ECFF inset}
  .lbrow.me{background:var(--green-l);box-shadow:inset 0 0 0 2px var(--green)}
  .lbr{font-weight:900;text-align:center;font-size:15px;color:var(--muted)}
  .lbr svg.ic{font-size:28px}
  .lbn b{display:block;font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lbn small{color:var(--muted);font-size:11px}
  .lbp{font-weight:900;color:var(--accent-t);font-variant-numeric:tabular-nums}
  .lbsep{text-align:center;color:var(--soft)}
  .lbstatus{color:var(--muted);font-size:13px;margin:4px 0}
  .lbstatus:empty{display:none}
  .nick{user-select:text;-webkit-user-select:text;width:100%;padding:12px 14px;border-radius:14px;border:2px solid #E2D9FA;background:#FBFAFF;color:var(--text);font:inherit;font-size:16px;font-weight:600}
  .nick:focus{border-color:var(--accent);outline:none}
  .err{color:var(--danger);font-size:12px;font-weight:600;min-height:16px;margin-top:4px}
  #nickModal{z-index:46}   /* opens on top of the leaderboard window */

  /* Fake ad (website only) */
  #ad{position:fixed;inset:0;background:#000;color:#fff;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
  #ad.show{display:flex}
  #ad .tag{font-size:11px;letter-spacing:2px;color:#888;border:1px solid #444;padding:3px 8px;border-radius:6px}
  #ad h3{font-size:22px}
  #ad p{color:#aaa;font-size:14px;max-width:320px}
  #ad .count{font-size:48px;font-weight:800;color:#3FD685}
  /* Daily bonus */
  .days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 4px}
  .day{background:var(--card2);border-radius:14px;padding:7px 4px;text-align:center;font-size:12px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
  .day svg.ic{font-size:24px}
  .day.done{color:var(--green-d);background:var(--green-l)}
  .day.today{background:#FFF4D1;color:#5C3D00;box-shadow:inset 0 0 0 2.5px #FFC43D;animation:pulseDay 1.6s infinite}
  .day.wk{grid-column:span 2;background:linear-gradient(180deg,#FFE27A,#FFB800);color:#4A2600;box-shadow:0 3px 0 #C96A00}
  .day.wk svg.ic{font-size:32px}
  .day.wk.done{background:linear-gradient(180deg,#7CF0B0,#1FB868);color:#fff}
  .day.wk small{font-size:10px;font-weight:700}
  @keyframes pulseDay{0%,100%{transform:none}50%{transform:scale(1.05)}}
  .dailynote{font-size:13px;font-weight:700;color:var(--accent-t);text-align:center;margin-top:4px}
  .dailynote.broken{color:#9A6400}
  #dailyModal .big{text-align:center}

  /* Office scene */
  .scene{display:block;width:100%;height:auto;aspect-ratio:1.42/1;border-radius:0;background:#1F4FC9;touch-action:pan-y;box-shadow:0 5px 0 #2A1F7A,0 12px 26px rgba(40,20,120,.28);cursor:pointer}
  .office{border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 5px 0 #2A1F7A,0 12px 26px rgba(40,20,120,.28)}
  .office .scene{box-shadow:none!important}
  .teambar{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 10px}
  .teambar .ico svg{width:44px;height:44px;display:block}
  .teambar .tbt{min-width:0}
  .teambar b{display:block;font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .teambar small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--muted);font-size:12px;font-weight:600;line-height:1.3;overflow:hidden}
  .gen.flash{animation:genFlash 1.1s ease-out}
  @keyframes genFlash{0%{box-shadow:0 0 0 4px var(--flash),var(--shadow);transform:scale(1.025)}60%{box-shadow:0 0 0 3px var(--flash),var(--shadow);transform:none}100%{box-shadow:var(--shadow)}}

  /* Piggy bank */
  .piggy{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border-radius:18px;padding:9px 12px;box-shadow:var(--shadow);text-align:start;color:var(--text)}
  .piggy[hidden]{display:none}
  .piggy .pi{width:42px;height:42px;border-radius:13px;background:#FFE3EF;display:grid;place-items:center;flex:none}
  .piggy .pi svg.ic{font-size:30px}
  .piggy .pm{flex:1;min-width:0;display:flex;flex-direction:column}
  .piggy .pt{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-weight:800;font-size:14px}
  .piggy .pt b{color:var(--green-d);font-variant-numeric:tabular-nums;font-size:15px}
  .pbar{height:8px;border-radius:99px;background:#F3EEFF;overflow:hidden;margin:5px 0 3px}
  .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF8AB8,#F25C9A);border-radius:99px;transition:width .3s}
  .piggy small{font-size:12px;color:var(--muted);font-weight:600}
  .piggy.full{background:#FFF4D1;animation:piggyGlow 1.6s infinite}
  .piggy.full small{color:#8A5A00;font-weight:800}
  .piggy.full .pbar i{background:linear-gradient(90deg,#FFD452,#FF9A1F)}
  .piggy.full .pi{background:#fff;animation:piggyWig 1.2s infinite}
  @keyframes piggyGlow{0%,100%{box-shadow:inset 0 0 0 2.5px #FFC43D,var(--shadow)}50%{box-shadow:inset 0 0 0 2.5px #FFC43D,0 0 0 5px rgba(255,196,61,.35)}}
  @keyframes piggyWig{0%,100%{transform:none}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
  #piggyModal .big{text-align:center;margin-bottom:4px}
  #piggyModal .pbar{height:10px;margin:0 0 4px}
  #piggyModal.full .pbar i{background:linear-gradient(90deg,#FFD452,#FF9A1F)}
  .linkbtn{display:block;margin:12px auto 0;background:none;color:var(--muted);font-weight:700;font-size:14px;padding:4px 10px}

  /* Company sold: celebration and shareable result */
  #soldModal{z-index:44;background:radial-gradient(circle at 50% 30%,rgba(108,77,255,.55),rgba(30,35,64,.78))}
  .sold{text-align:center}
  .sold .stamp{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(180deg,#FFD452,#FF9A1F);color:#4A2600;font-weight:900;font-size:26px;padding:6px 18px;border-radius:14px;transform:rotate(-4deg);box-shadow:0 4px 0 #C96A00;animation:stampIn .55s cubic-bezier(.2,1.6,.4,1)}
  .sold .stamp svg.ic{font-size:30px}
  @keyframes stampIn{from{opacity:0;transform:rotate(-14deg) scale(2.2)}to{opacity:1;transform:rotate(-4deg) scale(1)}}
  .soldval{font-size:44px;font-weight:900;color:var(--accent-t);margin:14px 0 6px;font-variant-numeric:tabular-nums;line-height:1.1}
  .headline{background:#1E2340;color:#fff;border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;line-height:1.5;text-align:start}
  .headline small{display:block;color:#FFD452;font-size:11px;font-weight:900;letter-spacing:.5px;margin-bottom:2px}
  .soldstats{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
  .soldstats span{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800}
  .soldstats svg.ic{font-size:16px}
  .soldbest{color:var(--green-d);font-weight:900;font-size:14px;margin-top:6px}
  .soldbest:empty{display:none}
  .btns.col{flex-direction:column}
  .btns button[hidden]{display:none}
  .b-wa{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#3BDC77,#1FAF55);color:#fff;box-shadow:0 4px 0 #128A3E}
  .b-wa svg.ic{font-size:20px}
  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const milestoneCount = n => MILESTONES.reduce((c, m) => c + (n >= m ? 1 : 0), 0);
const nextMilestone = n => MILESTONES.find(m => m > n);

function salePoints(v, m) {

function israelParts(ms) {

    hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short', hourCycle: 'h23' });

    wd: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday) };

function unitCost(i) { return GENS[i].cost * Math.pow(R, S.owned[i]); }
function costN(i, n) { return unitCost(i) * (Math.pow(R, n) - 1) / (R - 1); }
function maxAffordable(i) {

/* ================= Formatting ================= */
const UNITS = ['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n, dec = false) {
  if (!isFinite(n)) return '∞';

  if (n < 1000) return (dec && n < 100 && n % 1 !== 0) ? n.toFixed(1).replace(/\.0$/, '') : Math.floor(n).toString();
  let e = Math.floor(Math.log10(n) / 3);
  let v = n / Math.pow(10, 3 * e);
  if (v >= 999.995) { e++; v = n / Math.pow(10, 3 * e); }

  return v.toFixed(v < 100 ? 2 : 1).replace(/\.?0+$/, '') + UNITS[e - 1];

function svgIcon(id, color) {

}
function toast(text, cls, ms = 2600, icon) {
  const el = document.createElement('div');
  el.className = 'toast' + (cls ? ' ' + cls : '');
  if (icon) { el.innerHTML = svgIcon(icon[0], icon[1]); const sp = document.createElement('span'); sp.textContent = text; el.appendChild(sp); }
  else el.textContent = text;
  if (cls === 'tip') { tipQueue.push([el, ms]); nextTip(); return; }   // tips wait their turn at the bottom
  const box = $('toasts');
  box.appendChild(el);
  while (box.children.length > 2) box.firstChild.remove();
  setTimeout(() => el.remove(), ms);
}
const tipQueue = [];
function nextTip() {
  const box = $('tipbox');
  if (box.children.length || !tipQueue.length) return;
  const [el, ms] = tipQueue.shift();
  box.appendChild(el);
  setTimeout(() => { el.remove(); nextTip(); }, ms);
}
function floatText(x, y, text) {

  el.className = 'float'; el.textContent = text;
  el.style.left = x + 'px'; el.style.top = (y - 20) + 'px';

}

function wrapLines(ctx, text, maxW) {
  const words = text.split(' '), lines = [];
  let line = '';
  words.forEach(w => { const test = line ? line + ' ' + w : w; if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; });
  if (line) lines.push(line);
  return lines;
}
// 1080×1080 image of the sale, for WhatsApp and social apps.
async function makeCard(d) {
  try { await document.fonts.load('900 60px Rubik'); } catch (_) {}
  const W = 1080, c = document.createElement('canvas'); c.width = c.height = W;
  const x = c.getContext('2d'), F = (w, px) => `${w} ${px}px Rubik, system-ui, sans-serif`;
  const bg = x.createLinearGradient(0, 0, W, W);
  bg.addColorStop(0, '#7354FA'); bg.addColorStop(.5, '#5B3FF0'); bg.addColorStop(1, '#2F6BEB');
  x.fillStyle = bg; x.fillRect(0, 0, W, W);
  x.fillStyle = 'rgba(255,255,255,.08)';
  [[930, 120, 260], [120, 980, 220], [980, 900, 120]].forEach(([cx, cy, r]) => { x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); });
  x.direction = S.lang === 'he' ? 'rtl' : 'ltr'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#fff'; x.font = F(800, 52); x.fillText(t('gameName'), W / 2, 110);
  // "SOLD!" stamp
  x.save(); x.translate(W / 2, 255); x.rotate(-0.07);
  x.font = F(900, 96); const sw = x.measureText(t('soldStamp')).width + 90;
  x.fillStyle = '#C96A00'; x.beginPath(); x.roundRect(-sw / 2, -70 + 12, sw, 140, 30); x.fill();
  const gg = x.createLinearGradient(0, -70, 0, 70); gg.addColorStop(0, '#FFD452'); gg.addColorStop(1, '#FF9A1F');
  x.fillStyle = gg; x.beginPath(); x.roundRect(-sw / 2, -70, sw, 140, 30); x.fill();
  x.fillStyle = '#4A2600'; x.fillText(t('soldStamp'), 0, 4); x.restore();
  // value
  x.fillStyle = '#fff'; x.font = F(900, 190); x.fillText('$' + fmt(d.val), W / 2, 485);
  // headline
  x.font = F(700, 44); const lines = wrapLines(x, plain(d.headline), 900).slice(0, 3);
  x.fillStyle = 'rgba(20,16,60,.45)'; x.beginPath(); x.roundRect(70, 610, W - 140, 70 + lines.length * 58, 34); x.fill();
  x.fillStyle = '#FFD452'; x.font = F(900, 30); x.fillText(t('soldBreaking'), W / 2, 650);
  x.fillStyle = '#fff'; x.font = F(700, 44);
  lines.forEach((l, i) => x.fillText(l, W / 2, 705 + i * 58));
  // stats line
  const stats = [plain(t('soldMin', { m: Math.max(1, Math.round(d.mins)) }))];
  if (d.counted) stats.push(plain(t('soldPts', { p: '+' + d.pts })));
  x.font = F(800, 40); x.fillStyle = '#E6FFF4'; x.fillText(stats.join('  ·  '), W / 2, 905);
  // call to action
  x.fillStyle = '#fff'; x.beginPath(); x.roundRect(170, 960, W - 340, 86, 43); x.fill();
  x.fillStyle = '#4B2FD6'; x.font = F(900, 42); x.fillText(S.lang === 'he' ? 'תעקוף אותי? 🚀' : 'Can you beat me? 🚀', W / 2, 1004);
  return c;
}
async function shareNow(d, from) {
  const text = shareText(d);

      if (card && navigator.canShare) {
        const blob = await new Promise(r => card.toBlob(r, 'image/png'));
        const file = new File([blob], 'garage-to-exit.png', { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) { data.files = [file]; data.text = text + '\n' + SITE_URL; delete data.url; }
      }
      await navigator.share(data); track('share_done', { from }); return;
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (card) {   // computer without a share menu: save the image
    const a = document.createElement('a'); a.href = card.toDataURL('image/png'); a.download = 'garage-to-exit.png'; a.click();
    track('share_image_saved', { from }); return;
  }
  openWhatsApp(text, from);

}

function currentSeason() {
  const si = seasonInfo();
  if (!S.season || S.season.id !== si.id) {
    if (S.season && S.season.sales > 0) S.prevSeason = { ...S.season };
    S.season = { id: si.id, score: 0, sales: 0, best: 0, fastestMin: 0, pending: false };
  }
  return S.season;
}
function recordSale(val, mins, pts) {
  const s = currentSeason();
  s.score += pts; s.sales += 1;
  s.best = Math.max(s.best, val);
  mins = Math.max(.1, mins);
  s.fastestMin = s.fastestMin ? Math.min(s.fastestMin, mins) : mins;
  s.pending = true;
}
const lbNum = n => iso(Math.round(n).toLocaleString('en-US'));
// Minutes as '12.3 min', or hours and minutes for long companies
const lbMins = m => m < 60 ? t('lbMin', { m: iso(Number(m).toFixed(1)) }) : hms(m * 60);
function dh(ms) {
  const h = Math.max(0, Math.floor(ms / 3600e3)), d = Math.floor(h / 24);
  return d ? t(d === 1 ? 'tDH1' : 'tDH', { d, h: h % 24 }) : t('tHM', { h, m: Math.max(0, Math.floor(ms / 60e3) % 60) });
}

// Global leaderboard client. Talks to Firebase through leaderboard.js (window.G2ELB), loaded only when configured.
const LB = {
  api: null, loading: null, error: null,
  connected() { return !!(window.G2ELB_MOCK || FIREBASE_CONFIG); },
  ensure() {
    if (this.api) return Promise.resolve(this.api);
    if (window.G2ELB_MOCK) { this.api = window.G2ELB_MOCK; return Promise.resolve(this.api); }
    if (!FIREBASE_CONFIG) return Promise.resolve(null);
    if (!this.loading) {
      this.loading = (window.G2ELB ? Promise.resolve() : new Promise((resolve, reject) => {   // load the client once
        const s = document.createElement('script');
        s.src = 'leaderboard.js'; s.onload = resolve; s.onerror = () => { s.remove(); reject(new Error('load')); };
        document.head.appendChild(s);
      })).then(() => window.G2ELB.init(FIREBASE_CONFIG)).then(() => (this.api = window.G2ELB))
        .catch(e => { this.loading = null; this.error = String(e && e.message || e); throw e; });
    }
    return this.loading;
  },
  async sync() {
    const s = currentSeason();
    if (!s.pending || !S.nick || !this.connected()) return false;
    try {
      const api = await this.ensure(); if (!api) return false;
      await api.submit(s.id, { name: S.nick, score: s.score, sales: s.sales, best: s.best,
        fastestMin: Math.round(s.fastestMin * 10) / 10, lang: S.lang });
      s.pending = false; save(); track('score_submitted', { score: s.score, sales: s.sales });
      return true;
    } catch (e) { this.error = String(e && e.message || e); track('score_submit_failed', { error: this.error }); return false; }
  },
};

// Offline earnings
function processOffline() {
  const now = Date.now();
  S.boostUntil = Math.min(S.boostUntil, now + BOOST_MAX_MS);    // a clock moved back cannot stretch the boost
  const elapsed = (now - S.lastSeen) / 1000;
  if (elapsed < 0) return;                                       // the phone clock went back: keep the later time
  S.lastSeen = now;
  // Not collected yet (the app was closed or paused with the window open): it waits in the save and adds up.
  const po = S.pendingOffline;
  if (elapsed >= 30) {
    const sec = Math.min(elapsed, OFFLINE_CAP_SEC);
    const boostedSec = Math.max(0, Math.min(sec, (S.boostUntil - (now - elapsed * 1000)) / 1000));
    const amount = baseIncome() * (sec + boostedSec);
    if (amount > 0) { po.amt += amount; po.sec = Math.min(po.sec + elapsed, 1e9); track('offline_offer', { away_sec: Math.round(elapsed), amount: Math.round(amount) }); }
  }
  if (!(po.amt > 0)) return;
  $('offlineText').textContent = t('offText', { t: hms(po.sec), cap: po.sec > OFFLINE_CAP_SEC ? t('offCap') : '' });
  $('offlineAmount').textContent = money(po.amt);
  $('offlineModal').classList.add('show');
  save();
}
function collectOffline(mult) {
  const po = S.pendingOffline;
  if (po.amt > 0) {
    earn(po.amt * mult);
    toast(t('toastCollected', { v: money(po.amt * mult) }), null, 2600, ['i-coin']);
    track('offline_collected', { mult });
  }
  S.pendingOffline = { amt: 0, sec: 0 };
  $('offlineModal').classList.remove('show');
  save(); render();
  setTimeout(checkDaily, 400);
}

const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;   // the phone's local date
const todayKey = () => dayKey(new Date());
const yesterdayKey = () => { const d = new Date(); return dayKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1)); };
let pendingDaily = null;
// Offered once a day from the player's second day (the first day already has the intro and tips), when no other window is open.
function dailyDue() {
  return S.seenIntro && (S.totalEarned >= 50 || S.exits > 0) && todayKey() > S.daily.last && dayKey(new Date(S.createdAt)) !== todayKey();
}
function checkDaily() {
  if (!dailyDue() || pendingDaily || document.querySelector('.modal.show') || $('ad').classList.contains('show')) return;
  const cont = S.daily.last === yesterdayKey();
  const streak = cont ? S.daily.streak + 1 : 1;
  const idx = (streak - 1) % 7;
  const amount = Math.max(baseIncome() * DAILY_MIN[idx] * 60, DAILY_FLOOR[idx]);
  pendingDaily = { streak, idx, amount, broken: !cont && S.daily.streak > 1 };
  renderDaily();
  $('dailyModal').classList.add('show');
  track('daily_offer', { streak, day: idx + 1, broken: pendingDaily.broken });
}

  for (let i = 0; i < 7; i++) {

// Each moment adds 20% of that moment's income, so buying a big team just before collecting does not inflate it.
const piggyRate = () => S.seenIntro ? Math.max(baseIncome() * PIGGY_RATE, PIGGY_FLOOR_RATE) : 0;
const piggyFull = () => S.piggy.sec >= PIGGY_CAP_SEC - 0.5;
const piggyShown = () => S.seenIntro && (S.exits > 0 || S.owned.some(n => n > 0));
function updatePiggy() {
  const p = S.piggy, now = Date.now(), d = (now - p.t) / 1000;
  if (!(d > 0)) return;                              // clock went back: wait until it passes the saved time
  p.t = now;
  const r = piggyRate();
  if (r <= 0) return;
  const use = Math.min(d, PIGGY_CAP_SEC - p.sec);   // real time, so the time away counts too
  if (use > 0) { p.amt += r * use; p.sec += use; }
}
const resetPiggy = () => { S.piggy = { amt: 0, sec: 0, t: Date.now() }; };
function renderPiggy() {
  const p = S.piggy, full = piggyFull(), w = (100 * Math.min(1, p.sec / PIGGY_CAP_SEC)).toFixed(1) + '%';
  const pb = $('piggyBtn');
  pb.hidden = !piggyShown();

    $('piggyAmt').textContent = money(p.amt);
    $('piggyFill').style.width = w;
    $('piggyStatus').textContent = full ? t('piggyFull') : t('piggyFillIn', { t: clock((PIGGY_CAP_SEC - p.sec) * 1000) });
    pb.classList.toggle('full', full);
  }
  if ($('piggyModal').classList.contains('show')) {
    $('piggyModal').classList.toggle('full', full);
    $('piggyText').textContent = t(full ? 'piggyTextFull' : 'piggyText');
    $('piggyBig').textContent = money(p.amt);
    $('piggyFill2').style.width = w;
    $('piggyNote').textContent = full ? '' : t('piggyFillIn', { t: clock((PIGGY_CAP_SEC - p.sec) * 1000) });
    $('piggyCollect').disabled = $('piggyDouble').disabled = !(p.amt > 0);
  }
}

// While the app is in the background: one reminder when the till is full, one for tomorrow's daily bonus (19:00).
function scheduleReminders() {
  const N = window.G2ENative; if (!NATIVE || !N || !N.scheduleReminders) return;
  const list = [], inc = baseIncome();
  if (inc > 0) list.push({ id: 1, at: Date.now() + OFFLINE_CAP_SEC * 1000, body: plain(t('notifFull', { v: money(inc * OFFLINE_CAP_SEC) })) });
  if (S.seenIntro && (S.totalEarned >= 50 || S.exits > 0)) {   // first reminder can be for tomorrow, the first bonus day
    const now = new Date(), claimed = S.daily.last === todayKey();
    const at = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (claimed ? 1 : 0), 19, 0, 0);
    if (at > now) {
      const streak = claimed ? S.daily.streak + 1 : (S.daily.last === yesterdayKey() ? S.daily.streak + 1 : 1);
      list.push({ id: 2, at: at.getTime(), body: plain(t('notifDaily', { d: (streak - 1) % 7 + 1 })) });
    }
  }
  updatePiggy();
  const pr = piggyRate(), pleft = PIGGY_CAP_SEC - S.piggy.sec;
  if (piggyShown() && pr > 0 && pleft > 600)
    list.push({ id: 3, at: Date.now() + pleft * 1000, body: plain(t('notifPiggy', { v: money(S.piggy.amt + pr * pleft) })) });
  N.scheduleReminders(t('gameName'), list);
}

      else if (i === next && i < vis && !walkers.some(w => w.i === i)) list.push({ d: -1, f: () => ghostZone(q.id, i) }); });
    list.push({ d: CEO[0] + CEO[1] + 1.2, f: () => { ceoTop = drawCEO(tm); } });
    walkers.forEach(w => {
      const p = Math.max(0, Math.min(1, (tm - w.t0) / 1.8)); if (p <= 0) return;
      const [du0, dv0] = door(), u = du0 + (w.to[0] - du0) * p, v = dv0 + (w.to[1] - dv0) * p;
      list.push({ d: u + v, f: () => { floorShadow(u, v, .8, .7); const id = GENS[w.i].id;
        person(u, v, { shirt: COL[id], stand: 1, robot: id === 'ai', speed: 14, ...look(w.i, 0) }, tm, w.i); } });
    });
    if (env > 0 && !reduce && shown.some(Boolean)) {                      // someone walks around with a coffee
      const p = (tm / 12) % 1, back = p > .5, q = back ? (1 - p) * 2 : p * 2, u = .6 + q * 8.8, v = 5.75;
      list.push({ d: u + v, f: () => { floorShadow(u, v, .8, .7); const top = person(u, v, { shirt: '#FF6B8A', stand: 1, speed: 14, skin: SKIN[4], hair: HAIR[2] }, tm, 3);
        const [x, y] = P(u + .15, v, 12 * TH / 18); rr(x - 1.5, y - 2, 3, 3.5, 1, '#FFFFFF'); } });
    }
    let ceoTop = 0;
    list.sort((a, b2) => a.d - b2.d).forEach(it => it.f());
    boxes = [];
    const spots = [];                                                     // bubble positions, nudged up so they never overlap
    GENS.forEach((q, i) => { if ((shown[i] || (i === next && i < vis)) && !(!shown[i] && walkers.some(w => w.i === i))) { const [x, y] = zoneTopXY(i); spots.push({ i, x, y }); } });
    // Numbers stay over their team (off screen when the team is); only the selected team's name is pulled in to stay readable.
    spots.forEach(p => { if (p.i === sel && p.x > -20 && p.x < W + 20) { const m = 62 * UZ(); p.x = Math.max(m, Math.min(W - m, p.x)); } });
    spots.sort((a, b2) => b2.y - a.y);
    const bh = 26 * UZ(), bw = 30 * UZ();   // small badges; the selected team's name sits above its badge
    spots.forEach((p, k) => { for (let j = 0; j < k; j++) { const q = spots[j]; if (Math.abs(q.x - p.x) < bw && p.y > q.y - bh) p.y = q.y - bh; } });
    const spotOf = {}; spots.forEach(p => { spotOf[p.i] = p; });
    GENS.forEach((q, i) => {                                              // bubbles on top
      if (!spotOf[i]) return;
      const { x, y } = spotOf[i], pop = Math.max(0, 1 - (now - (focusI === i ? focusT : -9)) / .5);
      const on = i === sel, bb = on ? bubble(i, x, y, S.owned[i], pop, !shown[i]) : badge(i, x, y, !shown[i], false);
      const [u0, v0, du, dv] = ZONE[q.id], c1 = P(u0, v0 + dv), c2 = P(u0 + du, v0), c3 = P(u0 + du, v0 + dv);
      boxes.push({ i, x0: Math.min(bb[0], c1[0]), y0: bb[1], x1: Math.max(bb[2], c2[0]), y1: Math.max(c3[1], bb[3]), top: bb[1] });
      rings.filter(r => r.i === i).forEach(r => { const p = (now - r.t0) / 1.2, [cx, cy] = P(u0 + du / 2, v0 + dv / 2);
        g.strokeStyle = `rgba(255,210,63,${1 - p})`; g.lineWidth = 3 * (1 - p) + .5; g.beginPath(); g.ellipse(cx, cy, (1 + p * 3) * TW * .5, (1 + p * 3) * TH * .5, 0, 0, 7); g.stroke();
        g.globalAlpha = Math.max(0, 1 - p * p); g.font = `900 ${15 * UZ()}px Rubik,system-ui,sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.lineWidth = 3.5; g.strokeStyle = INK; g.strokeText('×2!', x, y - 16 - p * 18); g.fillStyle = lin(g, 0, y - 40, 0, y, [[0, '#FFF3A0'], [1, '#FFB800']]); g.fillText('×2!', x, y - 16 - p * 18); g.globalAlpha = 1; });
    });
    const [cu, cv2] = [CEO[0] + 1.4, CEO[1] + .75], cp = P(cu, cv2);
    boxes.push({ i: FOUNDER, x0: cp[0] - TW * .9, y0: ceoTop - 4, x1: cp[0] + TW * .9, y1: cp[1] + TH * .8, top: ceoTop });
    if (boostActive()) {
      g.fillStyle = 'rgba(255,190,80,.08)'; g.fillRect(0, 0, W, H);
      const z = UZ(), pw = 38 * z, px = he() ? 10 : W - pw - 10, pulse = 1 + Math.sin(tm * 4) * .04;
      g.save(); g.translate(px + pw / 2, 20 * z); g.scale(pulse, pulse); g.translate(-px - pw / 2, -20 * z);
      rr(px, 10 * z, pw, 20 * z, 10 * z, lin(g, 0, 10 * z, 0, 30 * z, [[0, '#4BE38E'], [1, '#14A35A']]), INK, 1.5);
      g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.roundRect(px + 4 * z, 12 * z, pw - 8 * z, 6 * z, 3 * z); g.fill();
      g.font = `900 ${12 * z}px Rubik,system-ui,sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineWidth = 3; g.strokeStyle = INK;
      g.strokeText('×2', px + pw / 2, 20.5 * z); g.fillStyle = '#fff'; g.fillText('×2', px + pw / 2, 20.5 * z);
      g.restore();
    }
    floats.forEach(f => {
      const p = (tm - f.t0) / 1.4;
      if (f.code) { g.globalAlpha = Math.max(0, 1 - p * p); g.font = `900 ${12 * UZ()}px Rubik,system-ui,sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.lineWidth = 3; g.strokeStyle = INK; g.strokeText('</>', f.x, f.y - p * 22); g.fillStyle = '#FF8A3D'; g.fillText('</>', f.x, f.y - p * 22); g.globalAlpha = 1; }
      else coinText(f.x, f.y, f.txt, p);
    });
    drawParts();
    if (envFrom >= 0 && ch < .5 && !reduce) { g.fillStyle = `rgba(255,255,255,${.55 * (1 - ch / .5)})`; g.fillRect(0, 0, W, H); }
  }
  const FOUNDER = 8;

  function loop(ts) {
    raf = null;
    if (!onScreen || document.hidden) return;
    raf = requestAnimationFrame(loop);
    if (ts - lastDraw < (reduce ? 500 : 33)) return;                     // about 30 frames a second
    lastDraw = ts; draw(ts / 1000);
  }
  const kick = () => { if (!raf && onScreen && !document.hidden) raf = requestAnimationFrame(loop); };
  try { new IntersectionObserver(es => { onScreen = es[es.length - 1].isIntersecting; kick(); }).observe(cv); } catch (_) {}
  document.addEventListener('visibilitychange', kick);
  window.addEventListener('resize', kick);

  function focus(i) { focusI = i; focusT = now; if (W) lookAt(i); }
  function tapAt(x, y) {
    const f = boxes.find(b => b.i === FOUNDER);
    if (f && x >= f.x0 && x <= f.x1 && y >= f.y0 && y <= f.y1) { $('tapBtn').click(); return; }
    for (let q = boxes.length - 1; q >= 0; q--) {
      const b = boxes[q]; if (b.i === FOUNDER) continue;
      if (x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1) {
        if (b.i === sel) { track('scene_hire_tap', { gen: GENS[b.i].id }); buy(b.i); }   // tap the selected team again: hire
        else { sel = b.i; focus(b.i); track('scene_select', { gen: GENS[b.i].id }); render(true); }
        return;
      }
    }
  }
  const at = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => { const [x, y] = at(e); down = { x, y, pan: PAN, moved: false, id: e.pointerId }; });
  cv.addEventListener('pointermove', e => {
    if (!down || e.pointerId !== down.id) return;
    const [x] = at(e), dx = x - down.x;
    if (!down.moved && Math.abs(dx) > 7) { down.moved = true; PT = null; try { cv.setPointerCapture(e.pointerId); } catch (_) {} }
    if (down.moved) { PAN = Math.max(-panMax(), Math.min(panMax(), down.pan + dx)); kick(); }
  });
  cv.addEventListener('pointerup', e => { if (down && !down.moved) { const [x, y] = at(e); tapAt(x, y); } down = null; });
  cv.addEventListener('pointercancel', () => { down = null; });
  $('tapBtn').addEventListener('click', () => {                          // the founder codes faster on each tap
    tapUntil = now + .35; tapT = now;
    const b = boxes.find(q => q.i === FOUNDER);
    if (b && floats.length < 6) floats.push({ x: (b.x0 + b.x1) / 2 + (Math.random() - .5) * 14, y: b.top - 4, t0: now, code: 1 });
    if (b && floats.length < 7) floats.push({ x: (b.x0 + b.x1) / 2 + 22, y: b.top + 6, t0: now, txt: '+' + plain(money(tapValue(), true)) });   // the money from the tap, in the office
  });
  kick();
  return { kick, focus, sel: () => sel, select: i => { sel = i; }, draw: () => draw(performance.now() / 1000),
    hit: id => { const i = id === 'founder' ? FOUNDER : GENS.findIndex(q => q.id === id), b = boxes.find(q => q.i === i);
      if (!b) return null; if (i === FOUNDER) { const cp = P(CEO[0] + 1.4, CEO[1] + .75); return { x: cp[0], y: cp[1] - 8 }; } return { x: (b.x0 + b.x1) / 2, y: b.y0 + 4 }; },
    state: () => { const gb = boxes.find(b => b.i !== FOUNDER && !shown[b.i]);
      return { frames, env, W, H, stations: GENS.filter((_, i) => shown[i]).map(q => q.id), walkers: walkers.map(w => GENS[w.i].id), floats: floats.length,
        ghost: gb ? GENS[gb.i].id : null, sel: GENS[sel].id, seats: GENS.map((q, i) => shown[i] ? Math.min(seatsFor(S.owned[i]), seatSpots(q.id).length) : 0) }; } };
})();

/* ================= Loop & lifecycle ================= */
let last = performance.now();
let paused = false, loopId = null;
function startLoop() { if (!loopId) loopId = setInterval(tick, 100); }
function stopLoop() { clearInterval(loopId); loopId = null; }
function tick() {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 1);
  last = now;
  if (document.hidden || paused) return;
  S.playSec += dt;
  if (speed > 1) S.runTainted = true;   // developer speed: this company does not count in the competition
  earn(income() * dt * speed);
  updatePiggy();
  checkStage();
  render();
}

/* ================= Install, share, offline (web app) ================= */
// Developer panel is for testing only: open the game with #dev at the end of the address to see it.
const syncDev = () => { $('devBtn').hidden = NATIVE || !/dev/.test(location.hash); };   // never in the Android app
syncDev();
window.addEventListener('hashchange', syncDev);
const isStandalone = () => {
  try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (_) { return false; }
};
const isWeb = /^https?:$/.test(location.protocol) && !NATIVE;   // the app is served from https://localhost too
let installPrompt = null;
$('installBtn').hidden = !isWeb || isStandalone();
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; $('installBtn').hidden = isStandalone(); });

$('installBtn').addEventListener('click', async () => {
  track('install_clicked', { native: !!installPrompt });
  if (installPrompt) {
    try { installPrompt.prompt(); const r = await installPrompt.userChoice; track('install_choice', { outcome: r && r.outcome }); } catch (_) {}
    installPrompt = null;
  } else {
    openHelp('install', 'installTitle', 'install_button');   // iPhone and other browsers: show the steps
  }
});
$('shareBtn').addEventListener('click', () => shareNow(null, 'footer'));
$('policyLink').href = PRIVACY_URL;
$('privacyBtn').addEventListener('click', async () => {
  track('privacy_options_opened');
  if (window.G2ENative) await window.G2ENative.showPrivacyOptions();
});
// Hidden way to reach the developer panel on a phone: tap the version label 7 times.
let verTaps = 0, verTimer = null;
$('verLbl').addEventListener('click', () => {
  if (NATIVE) return;   // the developer panel does not exist in the Android app
  verTaps++; clearTimeout(verTimer); verTimer = setTimeout(() => { verTaps = 0; }, 2000);
  if (verTaps >= 7) { verTaps = 0; $('devBtn').hidden = !$('devBtn').hidden; }

/* ================= Android app hooks (called from native.js) ================= */
const MODAL_ORDER = ['piggyModal', 'dailyModal', 'soldModal', 'nickModal', 'lbModal', 'offlineModal', 'exitModal', 'devModal', 'stagesModal', 'helpModal', 'introModal'];
window.__g2eHooks = {
  // Android back button: close the top window. Returns true when something was closed.
  onBack() {
    if ($('adLoading').classList.contains('show') || $('ad').classList.contains('show')) return true;
    for (const id of MODAL_ORDER) {
      if (!$(id).classList.contains('show')) continue;
      if (id === 'dailyModal') claimDaily(1);
      else if (id === 'soldModal') closeSold();
      else if (id === 'offlineModal') collectOffline(1);
      else if (id === 'devModal') closeDev();
      else if (id === 'introModal') { $(id).classList.remove('show'); finishIntro(); }
      else if (id === 'helpModal') { $(id).classList.remove('show'); finishIntro(); }
      else $(id).classList.remove('show');
      return true;
    }
    return false;
  },
  pause() { if (paused) return; paused = true; stopLoop(); save(); scheduleReminders(); track('session_pause', { native: true }); },
  resume() { if (!paused) return; paused = false; cancelReminders(); processOffline(); last = performance.now(); startLoop(); render(); LB.sync(); setTimeout(checkDaily, 600); },
};
if (NATIVE) {
  const s = document.createElement('script');
  s.src = 'native.js';
  s.onload = () => { if (window.G2ENative) window.G2ENative.onChange(st => { $('privacyBtn').hidden = !st.privacyOptionsRequired; }); };
  document.head.appendChild(s);
}
if (isWeb && 'serviceWorker' in navigator) {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (_) {}
}

track('session_start', { returning: !!saved, exits: S.exits, lang: S.lang, standalone: isStandalone() });
applyLang();
if (!S.seenIntro) { $('introModal').classList.add('show'); track('tutorial_shown', { lang: S.lang }); }
if (saved) processOffline();
startLoop();
currentSeason();
setTimeout(() => LB.sync(), 3000);
setInterval(() => { if (!document.hidden && !paused) { save(); checkDaily(); } }, 5000);
if (NATIVE) cancelReminders();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { save(); track('session_pause'); }
  else { processOffline(); last = performance.now(); render(); setTimeout(checkDaily, 600); }
});
window.addEventListener('pagehide', () => { if (!document.hidden) save(); });

// Tiny debug handle for automated tests.
window.__g2e = { get S() { return S; }, income, valuation, exitGain, costN, maxAffordable, buy, earn, EVENTS,
  processOffline, setLang, STR, GEN_TXT, STAGE_TXT, STAGE_DESC, TERMS, TERM_GROUPS, openHelp,
  salePoints, seasonInfo, xpTotal, nextXpAt, render, currentSeason, LB, renderLB, makeCard, shareText, FX, checkDaily, todayKey, yesterdayKey, DAILY_MIN, DAILY_FLOOR, baseIncome, OFFLINE_CAP_SEC,
  updatePiggy, collectPiggy, piggyRate, piggyFull, PIGGY_RATE, PIGGY_CAP_SEC, PIGGY_FLOOR_RATE, scheduleReminders, Scene };
